[tool.poetry]
name = "ida"
version = "3"
description = "Fairdata IDA"
authors = ["Fairdata Developers <fairdata-dev@listat.csc.fi>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
gevent = "25.9.1"
ipdb = "0.13.13"
pika = "1.3.2"
psutil = "7.1.0"
psycopg2-binary = "2.9.11"
pymysql = "1.1.2"
python-dateutil = "2.9.0"
requests = "2.32.5"
responses = "0.25.8"
sortedcontainers = "2.4.0"
urllib3 = "2.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
